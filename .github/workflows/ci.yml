name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  production-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d billing_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:chaki@localhost:5432/billing_db?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_replace_before_production_1234567890
      JWT_REFRESH_SECRET: ci_refresh_secret_replace_before_production_1234567890
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ci_cookie_secret_1234567890
      CLIENT_URL: http://localhost:5173
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: ci@example.com
      SMTP_PASS: ci_smtp_password
      SMTP_FROM_NAME: Billing System CI
      SMTP_FROM_EMAIL: ci@example.com
      UPLOADS_DIR: ./uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations
        run: npm run db:migrate:prod --workspace=server

      - name: Run production checks
        run: npm run check
