services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-billing_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing} -d ${POSTGRES_DB:-billing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billing_db}?schema=public
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Billing System}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      AI_BACKGROUND_REMOVAL_PYTHON: ${AI_BACKGROUND_REMOVAL_PYTHON:-/opt/ai-venv/bin/python}
      AI_BACKGROUND_REMOVAL_MODEL: ${AI_BACKGROUND_REMOVAL_MODEL:-ZhengPeng7/BiRefNet}
      AI_BACKGROUND_REMOVAL_IMAGE_SIZE: ${AI_BACKGROUND_REMOVAL_IMAGE_SIZE:-768}
      AI_BACKGROUND_REMOVAL_TIMEOUT_MS: ${AI_BACKGROUND_REMOVAL_TIMEOUT_MS:-180000}
      HF_HOME: ${HF_HOME:-/app/model-cache}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
      - api_model_cache:/app/model-cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: "no"
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billing_db}?schema=public
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Billing System}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      AI_BACKGROUND_REMOVAL_PYTHON: ${AI_BACKGROUND_REMOVAL_PYTHON:-/opt/ai-venv/bin/python}
      AI_BACKGROUND_REMOVAL_MODEL: ${AI_BACKGROUND_REMOVAL_MODEL:-ZhengPeng7/BiRefNet}
      AI_BACKGROUND_REMOVAL_IMAGE_SIZE: ${AI_BACKGROUND_REMOVAL_IMAGE_SIZE:-768}
      AI_BACKGROUND_REMOVAL_TIMEOUT_MS: ${AI_BACKGROUND_REMOVAL_TIMEOUT_MS:-180000}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate:prod", "--workspace=server"]

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  api_uploads:
  api_logs:
  api_model_cache:
